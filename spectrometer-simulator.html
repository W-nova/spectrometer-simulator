<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成像光谱仪模拟器 · 双透镜反射式平面光栅 · 水平入射光路视图</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161c24; --panel2:#1c242e; --line:#2a3441;
    --fg:#e6edf3; --fg2:#9fb0c0; --accent:#4db8ff; --warn:#ffb454; --bad:#ff6b6b; --ok:#63d68f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sub{color:var(--fg2);font-size:12px}
  #wrap{display:flex;height:calc(100% - 47px);min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #side{width:420px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px 12px 60px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:14px 0 6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
  h2:first-child{margin-top:2px}
  .ctl{margin-bottom:9px}
  .ctl .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
  .ctl label{font-size:12px;color:var(--fg)}
  .ctl input[type=range]{width:100%;height:16px;margin:0;accent-color:var(--accent)}
  .ctl input[type=number]{width:104px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
     border-radius:5px;padding:2px 6px;font:inherit;font-size:12px;text-align:right}
  .ctl input[type=number]:disabled{opacity:.45}
  .ctl .unit{color:var(--fg2);font-size:11px;margin-left:4px}
  .grp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:8px 0;font-size:12px}
  .grp label{display:block;margin:3px 0}
  .state{padding:6px 9px;border-radius:6px;background:rgba(77,184,255,.10);border:1px solid rgba(77,184,255,.35);font-size:12px;margin-bottom:6px}
  .state.error{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.45);color:#ffc9c9}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  td{padding:2px 0;vertical-align:top}
  td.k{color:var(--fg2);white-space:normal;padding-right:8px;width:56%}
  td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  td.f{color:#8fa3b6;font-family:Consolas,"Cascadia Mono",monospace;font-size:10.5px;padding:0 0 5px 0;word-break:break-word}
  /* ---- panel toolbar: key-results / full-detail switch ---- */
  #panelbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
     background:var(--panel);border-bottom:1px solid var(--line);padding:6px 0 8px;margin:0 0 8px}
  #panelbar .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #panelbar .seg button{background:transparent;border:0;color:var(--fg2);font:inherit;font-size:11.5px;
     padding:3px 10px;cursor:pointer}
  #panelbar .seg button.on{background:rgba(77,184,255,.16);color:var(--fg);font-weight:600}
  #panelbar .hint{color:var(--fg2);font-size:11px}
  #panelbar .chip{color:var(--fg2);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px}
  #side{font-size:12.5px}

  /* Formulas and derivations belong to the DETAIL view. */
  #side[data-mode="summary"] td.f{display:none}
  #side[data-mode="summary"] #panelbar .hint{display:inline}
  /* The mode is chosen in JS: summary by default, and on a narrow window summary is forced
     unless the user explicitly asks for the formulas. CSS only honours data-mode, so a single
     attribute drives the whole panel consistently. */
  @media (max-width: 1100px) {
    #side{width:min(420px,46vw)}
  }
  @media (max-width: 780px) {
    #wrap{flex-direction:column}
    #stage{height:52%;min-height:240px}
    #side{width:100%;border-left:0;border-top:1px solid var(--line);flex:1}
    header h1{font-size:15px}
    header .sub{font-size:11px}
  }
  td .u{color:var(--fg2);font-weight:400;font-size:10.5px}
  tr.err td{color:#ffc9c9}
  tr.warn td{color:#ffd9a3}
  #overlay{position:absolute;left:10px;top:8px;font-size:11px;color:var(--fg2);
     background:rgba(15,20,25,.78);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
     font-family:Consolas,monospace;pointer-events:none;line-height:1.5;white-space:pre}
  .footnote{color:var(--fg2);font-size:11px;margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>成像光谱仪模拟器</h1>
  <span class="sub" id="subtitle">双透镜反射式平面光栅光谱仪 · 二维色散平面逐面追迹 · 真实有限口径渐晕 · 公式与代入可现场验算</span>
</header>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
    <!-- #inset (focal-plane view) is created by app.js and drawn from the same solved snapshot -->
  </div>
  <div id="side">
    <div class="grp">
      <label><input type="radio" name="apertureMode" id="modeReal" checked> 真实实物口径（光栅 25 mm、两镜 25.4 mm，会出现真实渐晕）</label>
      <label><input type="radio" name="apertureMode" id="modeIdeal"> 理想不限口径（研究用，非真实仪器结果）</label>
    </div>
    <div class="grp">
      <label><input type="radio" name="constraint" id="constraintFixedN" checked> 固定 N（默认）：改 G/λ0 时重解 α、β 与机构方向</label>
      <label><input type="radio" name="constraint" id="constraintFixedAlpha"> 固定 α（研究）：按光栅方程反求 N（提示需更换光栅）</label>
      <label style="margin-top:2px">锁定入射角 α（研究模式）：<input type="number" id="alphaRef" step="0.0001" value="72.4412526684" style="width:120px"></label>
    </div>

    <h2>光学参数</h2>
    <div id="controls"></div>

    <h2>显示</h2>
    <div class="grp">
      <label><input type="checkbox" id="showChief" checked> 主光线</label>
      <label><input type="checkbox" id="showAperture" checked> 孔径采样光线</label>
      <label><input type="checkbox" id="showEdge" checked> 狭缝边缘光线</label>
      <label><input type="checkbox" id="showAxis" checked> 光轴</label>
      <label><input type="checkbox" id="showLabels" checked> 标注</label>
    </div>

    <div id="panelbar">
      <span class="hint">显示</span>
      <span class="seg">
        <button type="button" id="modeSummary" title="只显示关键指标结果">关键结果</button>
        <button type="button" id="modeDetail" title="展开公式、代入过程与说明">展开公式</button>
      </span>
      <span class="chip" id="modeChip"></span>
    </div>
    <div id="panels"></div>
    <p class="footnote">二维色散平面理想薄透镜模型：不含镜头像差、光栅效率、偏振、真实 LSF 与空间向（z）渐晕。真实口径下的光线丢失是物理渐晕，不是错误。</p>
  </div>
</div>

      if (Number.isFinite(ar) && ar > 0) ui.alphaRef_deg = ar;
    }
    return ui;
  }

  function syncControls(input) {
    for (var i = 0; i < CONTROLS.length; i++) {
      var c = CONTROLS[i];
      var n = $('n_' + c.id), r = $('r_' + c.id);
      if (!n) continue;
      var v = input[c.key];
      if (v === null || v === undefined) continue;
      var shown = c.key === 'nRay' ? String(Math.round(v)) : String(Number(v));
      n.value = shown;
      if (r) r.value = String(v);
      var out = $('v_' + c.id);
      if (out) out.textContent = shown + (c.unit ? ' ' + c.unit : '');
    }
    var ne = $('n_N');
    if (ne && input.constraint === 'fixedN') { ne.disabled = false; }
    else if (ne) { ne.disabled = true; }
  }

  function renderPanels(model) {
    var host = $('panels');
    if (!host) return;
    var html = ['<div class="state">state: <b>' + model.status + '</b></div>'];
    for (var s = 0; s < model.sections.length; s++) {
      var sec = model.sections[s];
      html.push('<h2>' + sec.title + '</h2><table>');
      for (var r = 0; r < sec.rows.length; r++) {
        var row = sec.rows[r];
        var cls = row.error ? ' class="err"' : (row.warning ? ' class="warn"' : '');
        html.push('<tr' + cls + '><td class="k">' + row.label + '</td><td class="v">' + row.value +
          (row.unit ? ' <span class="u">' + row.unit + '</span>' : '') + '</td></tr>');
        if (row.formula) html.push('<tr><td colspan="2" class="f">' + row.formula + '</td></tr>');
      }
      html.push('</table>');
    }
    host.innerHTML = html.join('');
  }
  function renderError(errors) {
    var host = $('panels');
    if (!host) return;
    var html = ['<div class="state error">input rejected - no optical path is drawn</div>', '<h2>input problems</h2><table>'];
    for (var i = 0; i < errors.length; i++) {
      html.push('<tr class="err"><td class="k">' + (errors[i].field || '') + '</td><td class="v">' + errors[i].message + '</td></tr>');
    }
    html.push('</table>');
    host.innerHTML = html.join('');
  }
  function renderStatusError(status, errors) {
    var host = $('panels');
    if (!host) return;
    var html = ['<div class="state error">no physical solution: <b>' + status + '</b></div>', '<table>'];
    for (var i = 0; i < (errors || []).length; i++) {
      html.push('<tr class="err"><td class="k">' + (errors[i].code || '') + '</td><td class="v">' + errors[i].message + '</td></tr>');
    }
    html.push('</table>');
    host.innerHTML = html.join('');
  }

  function resize(canvas) {
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var host = canvas.parentElement;
    var rect = host.getBoundingClientRect();
    var w = Math.max(320, Math.round((rect.width || 800)));
    var h = Math.max(240, Math.round((rect.height || 600)));
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    return { w: canvas.width, h: canvas.height, dpr: dpr, cssW: w, cssH: h };
  }

  /** Focal-plane inset canvas, created once inside #stage (bottom-right corner). */
  function ensureInsetCanvas() {
    var ic = $('inset');
    if (ic) return ic;
    var stage = $('stage');
    if (!stage || !stage.appendChild) return null;
    ic = doc.createElement('canvas');
    ic.id = 'inset';
    ic.style.cssText = 'position:absolute;right:10px;bottom:10px;width:330px;height:190px;' +
      'border-radius:7px;pointer-events:none';
    stage.appendChild(ic);
    return ic;
  }

  function drawInset(result) {
    var ic = ensureInsetCanvas();
    if (!ic || !ic.getContext) return null;
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var cssW = 330, cssH = 190;
    ic.width = Math.round(cssW * dpr);
    ic.height = Math.round(cssH * dpr);
    if (ic.style) { ic.style.width = cssW + 'px'; ic.style.height = cssH + 'px'; }
    var info = C.renderInset(ic.getContext('2d'), cssW, cssH, result.solved, result.metrics, { dpr: dpr });
    app.lastInset = info;
    return info;
  }

  function draw(result) {
    var canvas = $('cv');
    if (!canvas || !canvas.getContext) return null;
    var size = resize(canvas);
    var ctx = canvas.getContext('2d');
    var renderer = C.makeRenderer(ctx, size.w, size.h);
    var info = renderer.render(result, { paddingPx: Math.round(26 * size.dpr), show: result.input.show });
    info.size = size;
    app.lastRender = info;
    app.last = result;
    drawInset(result);
    updateOverlay(result);
    return info;
  }

  function refresh() {
    var t0 = (root.performance && root.performance.now) ? root.performance.now() : Date.now();
    var raw = readUI();
    var validated = C.parseAndValidateInput(raw);
    if (!validated.ok) {
      app.lastError = { stage: 'input', errors: validated.errors };
      app.last = null;
      renderError(validated.errors);
      clearCanvas();
      return app.lastError;
    }
    var design = C.solveDesign(validated.input);
    if (!design.ok) {
      app.lastError = { stage: 'design', status: design.status, errors: design.errors };
      app.last = null;
      renderStatusError(design.status, design.errors);
      clearCanvas();
      return app.lastError;
    }
    var solved = design.solved;
    var geometry = C.buildGeometry(solved);
    var scene = C.traceScene(solved, geometry);
    var metrics = C.computeMetrics(solved, geometry, scene);
    var result = { ok: true, input: validated.input, solved: solved, geometry: geometry, scene: scene, metrics: metrics, status: solved.status };
    app.last = result;
    app.lastError = null;
    syncControls(validated.input);
    var panelModel = C.panels.build(result);
    renderPanels(panelModel);
    var panelRays = { transmitted: 0, clipped: 0, rejected: 0 };
    for (var bi2 = 0; bi2 < scene.bands.length; bi2++) {
      var sb2 = scene.bands[bi2];
      if (!sb2.ok) continue;
      for (var k2 = 0; k2 < sb2.aperture.length; k2++) {
        var st2 = sb2.aperture[k2].status;
        if (st2 === C.STATUS.VALID || st2 === C.WARNING_CODES.CROSS_NORMAL) panelRays.transmitted++;
        else if (String(st2).indexOf('CLIPPED') === 0) panelRays.clipped++;
        else panelRays.rejected++;
      }
    }
    draw(result);
    app.renderMs = ((root.performance && root.performance.now) ? root.performance.now() : Date.now()) - t0;
    updateOverlay(result);
    return result;
  }

  /** Status line above the canvas; always derived from the same solved snapshot as the drawing. */
  function updateOverlay(result) {
    var ov = $('overlay');
    if (!ov || !result || !result.solved) return;
    var solved = result.solved, metrics = result.metrics;
    var counts = { transmitted: 0, clipped: 0, rejected: 0 };
    for (var bi = 0; bi < result.scene.bands.length; bi++) {
      var sb = result.scene.bands[bi];
      if (!sb.ok) continue;
      for (var k = 0; k < sb.aperture.length; k++) {
        var st = sb.aperture[k].status;
        if (st === C.STATUS.VALID || st === C.WARNING_CODES.CROSS_NORMAL) counts.transmitted++;
        else if (String(st).indexOf('CLIPPED') === 0) counts.clipped++;
        else counts.rejected++;
      }
    }
    var modeText = (solved.constraint === 'fixedAlpha' ? '固定 α（研究）' : '固定 N') + ' / ' +
      (solved.mode === 'real' ? '真实口径' : '理想口径');
    ov.textContent =
      'λ0 = ' + solved.lam0_nm.toFixed(1) + ' nm   α = ' + solved.alpha_deg.toFixed(4) + '°   β = ' + solved.beta_deg.toFixed(4) + '°\n' +
      'N = ' + solved.N.toFixed(3) + ' l/mm   G = ' + solved.G_deg.toFixed(2) + '°   m = ' + solved.m + '   ' + modeText + '\n' +
      'D = ' + solved.D.toFixed(2) + ' mm   D_eff = ' + metrics.D_eff_mm.toFixed(4) + ' mm   R_slit = ' + metrics.Rslit.toFixed(0) +
      '   R_grating(实物照射) = ' + metrics.Rgrating_real.toFixed(0) + '\n' +
      '透射 ' + counts.transmitted + ' / 裁切 ' + counts.clipped + ' / 拒绝 ' + counts.rejected;
  }

  function clearCanvas() {
    var ic = $('inset');
    if (ic && ic.getContext) {
      var ictx = ic.getContext('2d');
      ictx.setTransform(1, 0, 0, 1, 0, 0);
      ictx.clearRect(0, 0, ic.width, ic.height);
    }
    app.lastInset = null;
    // No stale numbers may survive a rejected design (BUG-08 class of defect).
    var ov = $('overlay');
    if (ov) ov.textContent = '';
    var canvas = $('cv');
    if (!canvas || !canvas.getContext) return;
    var size = resize(canvas);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.STYLE.bg; ctx.fillRect(0, 0, size.w, size.h);
    ctx.fillStyle = C.STYLE.clippedColor;
    ctx.font = (14 * size.dpr) + 'px system-ui, sans-serif';
    ctx.fillText('当前参数无物理可行光路 / no physical optical path for the current input', 24 * size.dpr, 40 * size.dpr);
    // Publish a cleared render state so the "nothing is drawn" claim is checkable.
    app.lastRender = {
      view: app.lastRender ? app.lastRender.view : null,
      counters: { raysDrawn: 0, raysClipped: 0, segments: 0, apertureRaysDrawn: 0, edgeRaysDrawn: 0, chiefRaysDrawn: 0 },
      labelRects: [], labels: 0, size: size, cleared: true,
    };
  }

  function bind() {
    for (var i = 0; i < CONTROLS.length; i++) {
      (function (c) {
        var n = $('n_' + c.id), r = $('r_' + c.id);
        var commit = function (value) {
          if (n) n.value = String(value);
          if (r) r.value = String(value);
          var out = $('v_' + c.id);
          if (out) out.textContent = String(value) + (c.unit ? ' ' + c.unit : '');
          // Hand-editing N is an explicit statement about the grating: leave the research lock
          // and go back to fixed N (SPEC v3 section 3), keeping the radio and the boxes in sync.
          if (c.key === 'N' && $('constraintFixedN') && !$('constraintFixedN').checked) {
            $('constraintFixedN').checked = true;
            if ($('constraintFixedAlpha')) $('constraintFixedAlpha').checked = false;
          }
          refresh();
        };
        if (r) r.addEventListener('input', function (e) { commit(e.target.value); });
        if (n) {
          n.addEventListener('change', function (e) { commit(e.target.value); });
          n.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(n.value); });
        }
      })(CONTROLS[i]);
    }
    var radios = ['modeReal', 'modeIdeal', 'constraintFixedN', 'constraintFixedAlpha'];
    for (var k = 0; k < radios.length; k++) {
      var el = $(radios[k]);
      if (el) el.addEventListener('change', function () { refresh(); });
    }
    var showBoxes = ['showChief', 'showAperture', 'showEdge', 'showLabels', 'showAxis'];
    for (var s = 0; s < showBoxes.length; s++) {
      var box = $(showBoxes[s]);
      if (box) box.addEventListener('change', function () { refresh(); });
    }
    var ar = $('alphaRef');
    if (ar) ar.addEventListener('change', function () { refresh(); });
    // Panel detail switch: "key results" vs "formulas and derivations".
    var sumBtn = $('modeSummary'), detBtn = $('modeDetail');
    if (sumBtn) sumBtn.addEventListener('click', function () { applyMode('summary', true); });
    if (detBtn) detBtn.addEventListener('click', function () { applyMode('detail', true); });
    root.addEventListener('resize', function () {
      // Auto-follow the window size only while the user has not chosen a mode.
      applyMode(autoMode(), false);
      if (app.last) draw(app.last);
    });
  }

  function buildControlDom() {
    var host = $('controls');
    if (!host) return;
    var html = [];
    for (var i = 0; i < CONTROLS.length; i++) {
      var c = CONTROLS[i];
      html.push('<div class="ctl">');
      html.push('<div class="row"><label for="n_' + c.id + '">' + c.label + '</label>');
      html.push('<span><input type="number" id="n_' + c.id + '" step="' + c.step + '" min="' + c.min + '" max="' + c.max + '">');
      if (c.unit) html.push('<span class="unit">' + c.unit + '</span>');
      html.push('</span></div>');
      html.push('<input type="range" id="r_' + c.id + '" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '">');
      html.push('<span class="unit" id="v_' + c.id + '"></span>');
      html.push('</div>');
    }
    host.innerHTML = html.join('');
  }

  /** Write the default input into the freshly created controls so readUI() has real values. */
  function populateDefaults() {
    for (var i = 0; i < CONTROLS.length; i++) {
      var c = CONTROLS[i];
      var v = C.DEFAULT_INPUT[c.key];
      if (v === null || v === undefined) continue;
      var n = $('n_' + c.id), r = $('r_' + c.id), out = $('v_' + c.id);
      if (n) n.value = String(v);
      if (r) r.value = String(v);
      if (out) out.textContent = String(v) + (c.unit ? ' ' + c.unit : '');
    }
    if ($('modeReal')) $('modeReal').checked = C.DEFAULT_INPUT.mode === 'real';
    if ($('modeIdeal')) $('modeIdeal').checked = C.DEFAULT_INPUT.mode === 'ideal';
    if ($('constraintFixedN')) $('constraintFixedN').checked = C.DEFAULT_INPUT.constraint === 'fixedN';
    if ($('constraintFixedAlpha')) $('constraintFixedAlpha').checked = C.DEFAULT_INPUT.constraint === 'fixedAlpha';
  }

  function init() {
    buildControlDom();
    populateDefaults();
    applyMode(autoMode(), false);   // narrow window -> key results; roomy -> full formulas
    bind();
    refresh();
    return app;
  }

  app.init = init;
  app.refresh = refresh;
  app.draw = draw;
  app.drawInset = drawInset;
  app.updateOverlay = updateOverlay;
  app.applyMode = applyMode;
  app.panelMode = function () { return mode.value; };
  app.modeIsUserChosen = function () { return mode.userChosen; };
  app.autoMode = autoMode;
  app.readUI = readUI;
  app.CONTROLS = CONTROLS;

  if (doc && doc.readyState !== 'loading') init();
  else if (doc) doc.addEventListener('DOMContentLoaded', init);
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
